<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PD Clínica - Área do Paciente</title>
    <link rel="icon" href="/assets/media/icons/fav-icon.png" type="image/png" />

    <!-- Google Fonts Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/dashboard/area-do-paciente/css/perfil.css" />
    <link
      rel="stylesheet"
      href="/dashboard/agendamentos/css/criar-agendamento.css"
    />

    <!-- Scripts -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/e169e20a67.js"
      crossorigin="anonymous"
    ></script>
    <script src="/js/darkmode.js"></script>
  </head>
  <body>
    <!-- HEADER -->
    <div
      class="logo-container bg-teste p-5 text-center rounded-bottom-4 d-flex justify-content-between align-items-center"
    >
      <img
        src="/assets/media/logo/logo-dark.png"
        alt="PD Clínica"
        class="logo"
      />
      <button
        type="button"
        id="toggleDarkMode"
        class="btn-outline"
        aria-pressed="false"
      >
        <i class="bi bi-moon-stars"></i>
      </button>
    </div>

    <section id="criar-agendamento">
      <h2 class="mainTitle text-center">Criar Agendamento</h2>

      <form action="" method="post" class="formAgendamento">
        <fieldset>
          <div class="formContainer d-flex flex-column">
            <input
              type="text"
              class="form-control"
              id="nomePaciente"
              placeholder="Nome do paciente"
            />

            <input
              type="text"
              class="form-control"
              id="nomeMedico"
              placeholder="Nome do médico"
            />

            <input
              type="text"
              class="form-control"
              id="nomeEspecialidade"
              placeholder="Informe a especialidade"
            />

            <input
              type="text"
              class="form-control"
              id="nomeProcedimento"
              placeholder="Informe o procedimento"
            />

            <div class="containerHorario d-flex align-items-center">
              <fieldset class="containerData">
                <label for="dataAgendamento"> Data</label>
                <input type="date" class="form-control" id="dataAgendamento" />
              </fieldset>

              <fieldset class="containerHora">
                <label for="horaAgendamento"> Hora</label>
                <input type="time" class="form-control" id="horaAgendamento" />
              </fieldset>
            </div>

            <div class="containerHorario d-flex align-items-center">
              <fieldset class="containerValor">
                <label for="valorAgendamento"> Valor</label>
                <input type="text" class="form-control" id="valorAgendamento" />
              </fieldset>

              <fieldset class="containerStatus">
                <label for="statusAgendamento"> Status</label>
                <input
                  type="text"
                  class="form-control"
                  id="statusAgendamento"
                />
              </fieldset>
            </div>
          </div>

          <button onclick="history.back()" type="submit" class="btn-primary">
            Salvar
          </button>
        </fieldset>
      </form>
    </section>
    <br /><br /><br />

  </body>
</html>
