<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PD Clínica - Área do Paciente</title>
    <link rel="icon" href="/assets/media/icons/fav-icon.png" type="image/png" />

    <!-- Google Fonts Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css" />
    <link
      rel="stylesheet"
      href="/dashboard/consulta-medica/css/consultas.css"
    />
    <link rel="stylesheet" href="/dashboard/css/dashboard.css" />

    <!-- Scripts -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/e169e20a67.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- HEADER -->
    <div
      class="logo-container mb-5 bg-teste p-5 text-center rounded-bottom-4 d-flex justify-content-between align-items-center"
    >
      <img
        src="/assets/media/logo/logo-dark.png"
        alt="PD Clínica"
        class="logo"
      />
      <button
        type="button"
        id="toggleDarkMode"
        class="btn-outline"
        aria-pressed="false"
      >
        <i class="bi bi-moon-stars"></i>
      </button>
    </div>

    <main class="container d-flex gap-4">
      <aside class="col-lg-2 sidebar d-none d-sm-block">
        <nav class="sidebar-nav">
          <ul class="nav flex-column gap-3">
            <li class="nav-item">
              <a href="#" class="nav-link active">
                <i class="bi bi-calendar-check"></i> Consultas
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <section id="consultasMedicas" class="d-block w-100">
        <div class="dadosPerfil">
          <div class="containerTxt">
            <h3 class="subTitle">Nome:<span> Miguel Norato</span></h3>
            <h3 class="subTitle">Consulta Geral de Cardiologia</h3>
          </div>
          <div class="containerDateTime">
            <h3 class="subTitle">30/01/2026</h3>
            <h3 class="subTitle">10:30</h3>
          </div>
        </div>

        <form action="" method="post" class="formConsulta">
          <fieldset>
            <div class="diagnostico">
              <label for="nome">Diagnóstico</label>
              <input
                type="text"
                id="diagnostico"
                name="diagnostico"
                class="form-control"
              />
            </div>

            <div class="receita">
              <label for="receita">Receita</label>
              <input
                type="text"
                id="receita"
                name="receita"
                class="form-control"
              />
            </div>

            <div class="observacoes">
              <label for="observacoes">Observações</label>
              <input
                type="text"
                id="observacoes"
                name="observacoes"
                class="form-control"
              />
            </div>
          </fieldset>

          <div class="d-flex justify-content-end mt-5">
            <button onclick="history.back()" class="btn-primary" type="button">
              <i class="bi bi-floppy2 me-2"></i>Salvar
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="/js/darkmode.js"></script>
  </body>
</html>
