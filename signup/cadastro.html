<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PD Clínica</title>
    <link rel="icon" href="assets/media/icons/fav-icon.png" type="image/png" />
    <!--google fonts Lato-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="css/cadastro.css" />

    <!-- Scripts -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/e169e20a67.js"
      crossorigin="anonymous"
    ></script>
    <script src="/js/darkmode.js"></script>
  </head>
  <body>
    <!-- MAIN -->
    <button
      type="button"
      id="toggleDarkMode"
      class="btn-outline"
      aria-pressed="false"
      style="position: fixed; top: 20px; right: 20px; z-index: 1100"
    >
      <i class="bi bi-moon-stars"></i>
    </button>
    <main>
      <section id="cadastro" class="d-flex min-vh-100">
        <a href="/" class="position-absolute top-0 start-0 m-3" id="goBack">
          <i class="bi bi-arrow-left"></i> Voltar
        </a>
        <div class="coverContainer d-none d-lg-block">
          <img
            src="/assets/media/images/signin/signin-img.png"
            alt="Capa da Clínica"
            class="coverImg"
          />
        </div>

        <div
          class="formContainer d-flex flex-column justify-content-center align-items-center w-100"
        >
          <img
            src="/assets/media/logo/logo-light.png"
            alt="Logo PD Clínica"
            class="logoMobile logo"
          />

          <form class="needs-validation" id="signupForm">
            <legend>Registre-se</legend>

            <fieldset>
              <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Nome completo"
                required
                class="form-control"
              />
              <input
                type="email"
                id="email"
                name="email"
                placeholder="email@exemplo.com"
                required
                class="form-control"
              />
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Senha"
                required
                class="form-control"
              />

              <div class="radioGroup">
                <label class="radioContainer">
                  <input type="radio" name="role" value="medico" checked />
                  <span class="customRadio"></span>Médico(a)
                </label>

                <label class="radioContainer">
                  <input type="radio" name="role" value="atendente" />
                  <span class="customRadio"></span>Atendente
                </label>
              </div>
            </fieldset>

            <div class="btnContainer">
              <button class="btn-primary" type="button" id="handleSignup">
                Cadastrar
              </button>
              <p>Já possui uma conta? <a href="/signup/index.html">Login</a></p>
            </div>
          </form>
        </div>
      </section>
    </main>

    <div class="toast-container position-fixed top-0 end-0 p-3">
      <div
        id="errorToast"
        class="toast text-bg-danger"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="toast-body">errorMessage</div>
      </div>
    </div>

    <div
      class="modal fade"
      id="modalSuccessMessage"
      tabindex="-1"
      aria-labelledby="successModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div
            class="modal-body d-flex flex-column justify-content-center align-items-center gap-3 px-4 py-5 text-center"
          >
            <img
              src="/assets/media/icons/send_plane.svg"
              alt="Mensagem enviada com sucesso"
            />
            <h2 class="subTitle">Recebemos sua mensagem ;)</h2>
            <h3 class="subTitle">
              Em breve nossa equipe entrará em contato pelo e-mail.
            </h3>
            <button type="button" class="btn-primary" data-bs-dismiss="modal">
              Fechar
            </button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="js/cadastro.js"></script>
  </body>
</html>
