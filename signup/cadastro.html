<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PD Clínica</title>
    <link rel="icon" href="assets/media/icons/fav-icon.png" type="image/png" />
    <!--google fonts Lato-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="css/signup.css" />

    <!-- Scripts -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/e169e20a67.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <body>
      <main>

        <section id="cadastro">
          <img src="/assets/media/images/clinico.png" alt="imagem ilustrativa do predio da clínica" class="img-fluid d-none d-md-block">

          <img src="/assets/media/logo/logo-dark.png" alt="logo da pd clínica" class="img-fluid d-block d-md-none">

          <form action="" method="post">

            <legend>Registre-se</legend>

            <fieldset>

              <input type="text" id="nome" name="nome" placeholder="Nome completo" required>

              <input type="email" id="email" name="email" placeholder="email@exemplo.com" required>
  
              <input type="password" id="senha" name="senha" placeholder="Senha" required>

              <ul>
                <li>
                  <label class="radio-container">
                    <input type="radio" name="role" value="medico"> 
                    <span class="custom-radio"></span>Médico(a)
                  </label>
                  </li>

                <li>
                  <label class="radio-container">
                    <input type="radio" name="role" value="atendente"> 
                    <span class="custom-radio"></span>Atendente
                  </label>
                  </li>
              </ul>
              
            </fieldset>

              <button class="btn-primary" type="submit">Cadastrar</button>
              <p>Já possui uma conta? <a href="/signup/login.html">Login</a></p>
          </form>

        </section>

      </main>    

    <div
      class="modal fade"
      id="modalSuccessMessage"
      tabindex="-1"
      aria-labelledby="successModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div
            class="modal-body d-flex flex-column justify-content-center align-items-center gap-3 px-4 py-5 text-center"
          >
            <img
              src="/assets/media/icons/send_plane.svg"
              alt="Mensagem enviada com sucesso"
            />
            <h2 class="subTitle">Recebemos sua mensagem ;)</h2>
            <h3 class="subTitle">
              Em breve nossa equipe entrará em contato pelo e-mail.
            </h3>
            <button type="button" class="btn-primary" data-bs-dismiss="modal">
              Fechar
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="js/homepage.js"></script>
  </body>
</html>
